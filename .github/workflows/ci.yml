name: CI

on:
  # Feature branches run CI on every push, before a pull request exists.
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (just ci, includes Docker SSH tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-deny,just
      - run: just ci

  macos:
    # GitHub's macOS runners have no Docker, so the SSH integration tests
    # run on Linux only.
    name: macOS (just check)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,just
      - run: just check

  desktop:
    # The real clipboard tests need a display; a virtual X server provides
    # one, isolated from any real desktop.
    name: Linux desktop clipboard (Xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # One display, one clipboard: the tests must not run in parallel.
      - run: xvfb-run -a cargo test --workspace --all-features -- --ignored desktop_ --test-threads=1

  android:
    # The library crates must keep building for Android, the planned mobile
    # client's platform. The runner's preinstalled NDK compiles ring's C
    # code; nothing runs on Android.
    name: Android build check (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just android-check
