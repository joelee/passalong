[workspace]
resolver = "3"
members = [
    "crates/passalong-core",
    "crates/passalong-ssh",
    "crates/passalong-https",
    "crates/passalong-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/joelee/passalong"
description = "Lightweight cross-platform clipboard and file sharing over SSH"
homepage = "https://github.com/joelee/passalong"

# Third-party requirements are caret requirements, as published libraries
# need; the committed Cargo.lock and `--locked` keep builds reproducible.
# The workspace crates pin each other exactly.
[workspace.dependencies]
# Front-ends opt into the desktop clipboard with `features = ["desktop"]`.
passalong-core = { path = "crates/passalong-core", version = "=0.2.1", default-features = false }
passalong-ssh = { path = "crates/passalong-ssh", version = "=0.2.1" }
passalong-https = { path = "crates/passalong-https", version = "=0.2.1" }

aes-gcm = { version = "0.11.1", default-features = false, features = ["aes", "alloc", "zeroize"] }
anyhow = "1.0.104"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
arboard = { version = "3.6.1", default-features = false }
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.31", default-features = false, features = ["std"] }
gethostname = "1.1.0"
getrandom = "0.4.3"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
mime_guess = "2.0.5"
notify = "8.2.0"
# PNG encoding and decoding of clipboard images.
png = "0.18.1"
# Terminal UI for `passalong choose`. Only the crossterm backend, which
# ratatui re-exports as `ratatui::crossterm`.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# The passalong-server client: HTTP/1.1 over rustls, whose `ring` provider
# the SSH backend already brings, so no `aws-lc-rs` and no OpenSSL. The
# client builds its own TLS configuration: a pinned key, or the system's
# trust store through rustls-platform-verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
# `ring` instead of the default `aws-lc-rs`: no cmake needed and friendlier
# to cross-compilation (Android). RSA keys are opt-in through the `rsa`
# feature of passalong-ssh (RUSTSEC-2023-0071 has no fixed `rsa` release).
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2"] }
russh-sftp = "3.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["io"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "std"] }
zeroize = "1.9.0"

# Test-only
assert_cmd = "2.2.2"
predicates = "3.1.4"
# A TLS server that presents a pinned certificate without its private key;
# both are already in the tree through rustls.
ring = "0.17.14"
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
tempfile = "3.27.0"
tokio-test = "0.4.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
strip = true
lto = "thin"

# Argon2 derives a key from 64 MiB of memory; unoptimised it takes many
# seconds, which would make debug builds and tests crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
