[package]
name = "passalong"
description = "The passalong command-line client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/joelee/passalong/blob/main/docs/usage.md"
readme = "../../README.md"
keywords = ["clipboard", "file-sharing", "ssh", "sftp", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "passalong"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
dotenvy.workspace = true
passalong-core = { workspace = true, features = ["desktop"] }
passalong-ssh.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
passalong-core = { workspace = true, features = ["testing"] }
predicates.workspace = true
tempfile.workspace = true
