[package]
name = "passalong-ssh"
description = "SSH/SFTP storage backend for passalong"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/passalong-ssh"
readme = "README.md"
keywords = ["ssh", "sftp", "clipboard", "file-sharing"]
categories = ["network-programming"]

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
# RSA identity files and RSA host keys. Off by default: the `rsa` crate has
# an unfixed timing side channel (RUSTSEC-2023-0071). Ed25519 and ECDSA keys
# work in every build.
rsa = ["russh/rsa"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
passalong-core.workspace = true
russh.workspace = true
russh-sftp.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
passalong-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
