# cargo-deny policy. Run with `just audit`; CI runs it on every push.

[graph]
# Default features only: the optional `rsa` feature of passalong-ssh is left
# out, because the `rsa` crate has an unfixed advisory (RUSTSEC-2023-0071).
all-features = false

[advisories]

[licenses]
# Permissive licences only. A dependency offering several licences is
# accepted when any of them is listed here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
