# cargo-deny policy. Run with `just audit`; CI runs it on every push.

[graph]
all-features = true

[advisories]
ignore = [
    # `rsa` has a timing side channel in RSA decryption and signing (the
    # "Marvin" attack) and no fixed release yet. passalong reaches it only
    # through russh's `rsa` feature, to sign the SSH login when the identity
    # file is an RSA key; Ed25519 keys, the recommended default, never use
    # it. Kept so RSA identity files keep working; revisit when `rsa`
    # publishes a constant-time release.
    { id = "RUSTSEC-2023-0071", reason = "RSA identity files only; see comment" },
]

[licenses]
# Permissive licences only. A dependency offering several licences is
# accepted when any of them is listed here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
