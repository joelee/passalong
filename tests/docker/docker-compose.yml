# Throwaway OpenSSH server for the ignored SSH integration tests.
# Started and torn down by `just test-integration` / `just coverage-full`,
# which generate the key pair in ./keys (git-ignored) first.
services:
  sshd:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls236
    environment:
      TZ: Etc/UTC
      USER_NAME: passalong
      PUBLIC_KEY_DIR: /keys/authorized
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "false"
    ports:
      - "127.0.0.1:2222:2222"
    volumes:
      - ./keys:/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /config/ssh_host_keys/ssh_host_ed25519_key.pub && nc -z 127.0.0.1 2222"]
      interval: 2s
      timeout: 2s
      retries: 30
